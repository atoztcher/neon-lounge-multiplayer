<script>
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x07031a);
scene.fog=new THREE.Fog(0x07031a,25,60);
const cam=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,200);
cam.position.set(9,6.5,-6);
const ren=new THREE.WebGLRenderer({antialias:true,alpha:true});
ren.setPixelRatio(Math.min(devicePixelRatio,2));
ren.setSize(innerWidth,innerHeight);
document.body.appendChild(ren.domElement);
const ctl=new THREE.OrbitControls(cam,ren.domElement);
ctl.target.set(-1,3.5,8);ctl.enableDamping=true;ctl.maxPolarAngle=Math.PI*0.52;

// lights
scene.add(new THREE.AmbientLight(0x4a3a8c,0.9));
const pl=(c,i,x,y,z)=>{const l=new THREE.PointLight(c,i,22);l.position.set(x,y,z);scene.add(l);return l};
pl(0x5a4bff,1.6,0,6,0);pl(0xff3fd0,1.2,-7,1,2);pl(0x2fd0ff,1.2,8,3,-3);

const glow=(c)=>new THREE.MeshBasicMaterial({color:c});
const std=(c,r=0.6,m=0.2)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});

// canvas textures
function tex(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t}
const stripes=tex(256,256,(g,w,h)=>{g.fillStyle='#0a0a12';g.fillRect(0,0,w,h);g.fillStyle='#f2f2f8';
  for(let i=-4;i<8;i++){g.beginPath();g.moveTo(i*32,h);g.lineTo(i*32+16,h);g.lineTo(i*32+16+h,0);g.lineTo(i*32+h,0);g.fill()}});
stripes.repeat.set(4,4);
const swirl=tex(512,256,(g,w,h)=>{const gr=g.createLinearGradient(0,0,w,h);
  gr.addColorStop(0,'#1d2bff');gr.addColorStop(.35,'#ff4fd8');gr.addColorStop(.6,'#7be9ff');gr.addColorStop(1,'#5a1bff');
  g.fillStyle=gr;g.fillRect(0,0,w,h);g.lineWidth=14;
  for(let i=0;i<7;i++){g.strokeStyle=['#ffffff55','#00000044','#ffd0f655'][i%3];g.beginPath();
    g.moveTo(0,i*40);g.bezierCurveTo(w*.3,i*40-90,w*.6,i*40+110,w,i*40-20);g.stroke()}});
const banner=tex(1024,64,(g,w,h)=>{g.fillStyle='#fff';g.fillRect(0,0,w,h);g.fillStyle='#111';g.font='italic 700 34px sans-serif';g.textBaseline='middle';
  g.fillText('Life is to enjoy   ·   Music   ·   Art   ·   Trendy   ·   We are number one   ·   Life is to enjoy',20,h/2)});

// floor
const floor=new THREE.Mesh(new THREE.PlaneGeometry(30,24),new THREE.MeshStandardMaterial({color:0x08060f,roughness:.15,metalness:.8}));
floor.rotation.x=-Math.PI/2;scene.add(floor);
const dance=new THREE.Mesh(new THREE.CircleGeometry(6,48),new THREE.MeshStandardMaterial({map:stripes,roughness:.3,metalness:.4}));
dance.rotation.x=-Math.PI/2;dance.position.set(-1,0.01,3);scene.add(dance);

// walls
const wallM=std(0x1a1040,.8,.1);
const back=new THREE.Mesh(new THREE.PlaneGeometry(30,9),wallM);back.position.set(0,4.5,-12);scene.add(back);
const left=new THREE.Mesh(new THREE.PlaneGeometry(24,9),wallM);left.rotation.y=Math.PI/2;left.position.set(-15,4.5,0);scene.add(left);
const right=left.clone();right.rotation.y=-Math.PI/2;right.position.x=15;scene.add(right);
// vertical blue light strips on left wall
for(let i=0;i<8;i++){const s=new THREE.Mesh(new THREE.BoxGeometry(.12,5,.12),glow(0x3a6bff));s.position.set(-14.9,3,-10+i*3);scene.add(s)}
// LED screens
const scrM=new THREE.MeshBasicMaterial({map:swirl});
[[-5,-11.9],[5,-11.9]].forEach(([x,z])=>{const m=new THREE.Mesh(new THREE.BoxGeometry(7,2.6,.2),scrM);m.position.set(x,3.2,z);scene.add(m)});
const rs=new THREE.Mesh(new THREE.BoxGeometry(9,2.6,.2),scrM);rs.rotation.y=-Math.PI/2;rs.position.set(14.8,3.2,-2);scene.add(rs);

// ceiling rings
const ceil=new THREE.Mesh(new THREE.PlaneGeometry(30,24),std(0x0c0720,.9));ceil.rotation.x=Math.PI/2;ceil.position.y=9;scene.add(ceil);
const ringCols=[0x4a35ff,0xb04bff,0x2f7bff,0xff4fd8];
for(let i=0;i<9;i++){const t=new THREE.Mesh(new THREE.TorusGeometry(5+i*1.8,.12,8,64),glow(ringCols[i%4]));
  t.rotation.x=Math.PI/2;t.scale.set(1.5,1,1);t.position.set(0,8.6-i*0.05,-2);scene.add(t);
  const w=new THREE.Mesh(new THREE.TorusGeometry(5+i*1.8,.3,6,64),std(i%2?0xf0f0ff:0x15122a,.3,.6));

// chandeliers (stacked rings + cone + spiral)
function chandelier(x,z){
  const g=new THREE.Group();
  for(let i=0;i<6;i++){const r=2.6-i*.3;
    const t=new THREE.Mesh(new THREE.TorusGeometry(r,.1,8,40),glow(i%2?0x6a4bff:0xff6adf));t.rotation.x=Math.PI/2;t.position.y=-i*.45;g.add(t)}
  const cone=new THREE.Mesh(new THREE.ConeGeometry(2.4,1.6,32,1,true),new THREE.MeshBasicMaterial({map:swirl,side:THREE.DoubleSide}));
  cone.rotation.x=Math.PI;cone.position.y=-.4;g.add(cone);
  const pts=[];for(let i=0;i<=120;i++){const a=i*.35,y=-i*.05;pts.push(new THREE.Vector3(Math.cos(a)*(1.1-i*.004),y-2,Math.sin(a)*(1.1-i*.004)))}
  g.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),200,.07,6),glow(0xe6f4ff)));
  g.position.set(x,8.3,z);scene.add(g);return g}
const ch=[chandelier(-4,-3),chandelier(5,-6)];

// rounded, puffy box: bo cong cac goc bang cach day dinh ra khoi loi hop
function rbox(w,h,d,r,mat,seg=12){
  const g=new THREE.BoxGeometry(w,h,d,seg,seg,seg),p=g.attributes.position;
  const v=new THREE.Vector3(),c=new THREE.Vector3(),hx=w/2-r,hy=h/2-r,hz=d/2-r,cl=(a,m)=>Math.max(-m,Math.min(m,a));
  for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i);c.set(cl(v.x,hx),cl(v.y,hy),cl(v.z,hz));
    const dir=v.clone().sub(c);if(dir.lengthSq()>0)dir.normalize().multiplyScalar(r);v.copy(c).add(dir);p.setXYZ(i,v.x,v.y,v.z)}
  g.computeVertexNormals();return new THREE.Mesh(g,mat)}

// sofa mem: de, dem ngoi, dem lung, tay vin, goi tua
function sofa(x,z,ry,len=4,col=0x3a2230){
  const g=new THREE.Group();
  const fab=new THREE.MeshStandardMaterial({color:col,roughness:.95,metalness:0});
  const fab2=new THREE.MeshStandardMaterial({color:new THREE.Color(col).offsetHSL(0,0,.05),roughness:.9,metalness:0});
  g.userData.sofaLen=len;const plinth=rbox(len,.3,1.4,.1,std(0x120a1c,.6,.2));plinth.position.y=.2;g.add(plinth);
  const inner=len-.7,n=Math.max(1,Math.round(inner/1.2)),cw=inner/n;
  for(let i=0;i<n;i++){const cx=-inner/2+cw*(i+.5);
    const seat=rbox(cw-.04,.42,1.05,.17,fab);seat.position.set(cx,.55,.12);g.add(seat);
    const back=rbox(cw-.04,.85,.38,.16,fab2);back.position.set(cx,1.1,-.5);back.rotation.x=-.12;g.add(back)}
  [-1,1].forEach(s=>{const arm=rbox(.38,.85,1.4,.17,fab2);arm.position.set(s*(len/2-.19),.75,0);g.add(arm)});
  for(let i=0;i<Math.floor(len/1.5);i++){const p=rbox(.6,.55,.22,.1,std(0xa99be0,.55,.1));
    p.position.set(-len/2+1.1+i*1.5,1.0,-.12);p.rotation.set(-.25,0,(i%2?.18:-.18));g.add(p)}
  const gl=new THREE.Mesh(new THREE.BoxGeometry(len+.15,.05,1.5),glow(0xff2fd0));gl.position.y=.04;g.add(gl);
  g.position.set(x,0,z);g.rotation.y=ry;scene.add(g)}

function sofaOld(x,z,ry,len=4,col=0x3a2230){
  const g=new THREE.Group();
  const base=new THREE.Mesh(new THREE.BoxGeometry(len,.6,1.3),std(col,.5,.3));base.position.y=.4;g.add(base);
  const bk=new THREE.Mesh(new THREE.BoxGeometry(len,1.1,.35),std(col,.5,.3));bk.position.set(0,1.0,-.5);g.add(bk);
  const glowS=new THREE.Mesh(new THREE.BoxGeometry(len+.1,.06,1.4),glow(0xff2fd0));glowS.position.y=.08;g.add(glowS);
  for(let i=0;i<Math.floor(len/1.2);i++){const p=new THREE.Mesh(new THREE.BoxGeometry(.6,.5,.15),std(0x9a8bd8,.3,.6));
    p.position.set(-len/2+.8+i*1.2,1.0,-.25);p.rotation.z=.2;g.add(p)}
  g.position.set(x,0,z);g.rotation.y=ry;scene.add(g)}
// left wall long sofas
// ===== BO CUC MOI: doi xung, sat tuong, moi sofa co 1 ban chu nhat phia truoc =====
const plum=0x3d2150,wine=0x4a1d38,navy=0x1f2d5c;
const PI2=Math.PI/2;
// 2 sofa chu L o hai goc tuong sau
lsofa(-14.8+2.25,-11.2,0,4.5,3.2,plum,true);
lsofa(14.8-2.25,-11.2,0,4.5,3.2,plum,false);
rtable(-11.7,-8.6,0,1.8,.8);rtable(11.7,-8.6,0,1.8,.8);
// 3 sofa thang tuong sau
[-6,0,6].forEach((x,i)=>{sofa(x,-11.2,0,4.5,i==1?navy:wine);rtable(x,-8.8,0,2.2,.8)});
// tuong trai: 2 sofa thang + 1 sofa chu L phia truoc
[-5,-1].forEach(z=>{sofa(-13.7,z,PI2,3.4,navy);rtable(-11.5,z,PI2,1.8,.8)});
lsofa(-14.2,4.5,PI2,4.5,3.2,wine,true);rtable(-11.7,3.7,PI2,1.8,.8);
// tuong phai
[-5,-1,3.4].forEach(z=>{sofa(13.7,z,-PI2,3.4,plum);rtable(11.5,z,-PI2,1.8,.8)});

// ---- sofa chu L: ghep 2 sofa thang ----
function sofaMod(len,col){sofa(0,0,0,len,col);const a=scene.children[scene.children.length-1];scene.remove(a);return a}
function lsofa(x,z,ry,len,wing,col,mirror){
  const g=new THREE.Group();g.add(sofaMod(len,col));
  const w=sofaMod(wing,col);w.rotation.y=-PI2;w.position.set(len/2-.7,0,.7+wing/2);g.add(w);
  g.scale.x=mirror?-1:1;g.position.set(x,0,z);g.rotation.y=ry;scene.add(g)}

// ---- ban chu nhat + shisha + ly ----
function rtable(x,z,ry,w=1.8,d=.8){
  const g=new THREE.Group();
  g.userData.tbl=[w,d];const top=rbox(w,.06,d,.025,std(0x0b0a14,.12,.9),8);top.position.y=.72;g.add(top);
  const rim=new THREE.Mesh(new THREE.BoxGeometry(w-.12,.02,d-.12),glow(0x3fd0ff));rim.position.y=.685;g.add(rim);
  const base=rbox(w-.5,.62,d-.3,.06,std(0x2a2744,.3,.7),8);base.position.y=.33;g.add(base);
  const s=shisha();s.position.set(-w*.28,.75,0);s.rotation.y=Math.random()*6;g.add(s);
  const gm=new THREE.MeshStandardMaterial({color:0xcfe8ff,transparent:true,opacity:.6,roughness:.1});
  for(let i=0;i<2;i++){const c=new THREE.Mesh(new THREE.CylinderGeometry(.04,.032,.1,12),gm);c.position.set(w*.2+i*.22,.8,i?.12:-.1);g.add(c)}
  const t=new THREE.Mesh(new THREE.CylinderGeometry(.07,.07,.02,16),std(0xb0b4d8,.2,.9));t.position.set(0,.76,.15);g.add(t);
  g.position.set(x,0,z);g.rotation.y=ry;scene.add(g)}

function shisha(){
  const g=new THREE.Group(),V=a=>a.map(p=>new THREE.Vector2(p[0],p[1]));
  const metal=std(0xd5d8f5,.15,.95),dark=std(0x2a1020,.4,.3);
  const glass=new THREE.MeshStandardMaterial({color:0x8fb8ff,roughness:.05,metalness:.1,transparent:true,opacity:.45});
  g.add(new THREE.Mesh(new THREE.LatheGeometry(V([[0,0],[.07,0],[.11,.04],[.125,.12],[.1,.2],[.05,.27],[.03,.32]]),24),glass));
  const water=new THREE.MeshBasicMaterial({color:0xff5fd2,transparent:true,opacity:.55});
  g.add(new THREE.Mesh(new THREE.LatheGeometry(V([[0,.01],[.06,.01],[.1,.04],[.11,.1],[0,.1]]),24),water));
  const stem=new THREE.Mesh(new THREE.CylinderGeometry(.02,.03,.42,12),metal);stem.position.y=.5;g.add(stem);
  [.36,.52,.64].forEach(y=>{const r=new THREE.Mesh(new THREE.TorusGeometry(.034,.01,8,16),metal);r.rotation.x=PI2;r.position.y=y;g.add(r)});
  const tray=new THREE.Mesh(new THREE.CylinderGeometry(.11,.08,.025,24),metal);tray.position.y=.71;g.add(tray);
  const bowl=new THREE.Mesh(new THREE.CylinderGeometry(.055,.035,.09,16),dark);bowl.position.y=.77;g.add(bowl);
  const coal=new THREE.Mesh(new THREE.CylinderGeometry(.05,.05,.01,16),glow(0xff7a2a));coal.position.y=.82;g.add(coal);
  const hose=new THREE.CatmullRomCurve3([[.03,.5,0],[.14,.47,.02],[.2,.3,.1],[.22,.08,.2],[.1,.02,.34],[-.1,.02,.38],[-.25,.025,.3]].map(p=>new THREE.Vector3(...p)));
  g.add(new THREE.Mesh(new THREE.TubeGeometry(hose,40,.012,8),std(0x6a1b4d,.6,.1)));
  const mp=new THREE.Mesh(new THREE.CylinderGeometry(.016,.012,.1,10),metal);mp.rotation.z=PI2;mp.position.set(-.3,.03,.28);g.add(mp);
  g.scale.setScalar(1.1);return g}
// mid booths (curved feel via angled segments)



// tables + hookah
function table(x,z){
  const g=new THREE.Group();
  const top=new THREE.Mesh(new THREE.CylinderGeometry(.6,.6,.08,20),std(0x111018,.2,.8));top.position.y=.75;g.add(top);
  const leg=new THREE.Mesh(new THREE.CylinderGeometry(.1,.15,.75,10),std(0x777799,.3,.8));leg.position.y=.38;g.add(leg);
  const h=new THREE.Mesh(new THREE.SphereGeometry(.2,12,10),std(0xcfd2ff,.1,.9));h.position.y=1.05;g.add(h);
  const pole=new THREE.Mesh(new THREE.CylinderGeometry(.03,.03,.6,6),std(0xcfd2ff,.2,.9));pole.position.y=1.4;g.add(pole);
  const bowl=new THREE.Mesh(new THREE.CylinderGeometry(.1,.06,.1,10),glow(0xff7be8));bowl.position.y=1.72;g.add(bowl);
  g.position.set(x,0,z);scene.add(g)}


// glowing sphere "DJ" light + side bar
const orb=new THREE.Mesh(new THREE.SphereGeometry(.6,16,12),glow(0xcfe9ff));orb.position.set(2,3.5,-6);scene.add(orb);
const bar=rbox(6,1.1,1.2,.15,std(0xd8d8f0,.2,.9));bar.position.set(11,.55,8);scene.add(bar);
const barG=new THREE.Mesh(new THREE.BoxGeometry(6.1,.08,1.3),glow(0x33d0ff));barG.position.set(11,1.15,8);scene.add(barG);

// ===== SAN KHAU DJ + MAN LED LON + DEN CHIU (tuong truoc, z=12) =====
const CY=0x19c8ff,BL=0x2a5bff,VI=0xa04bff;
const fw=new THREE.Mesh(new THREE.PlaneGeometry(30,9),std(0x050818,.9,.1));fw.rotation.y=Math.PI;fw.position.set(0,4.5,12);scene.add(fw);

function neonBar(x1,y1,x2,y2,w,col,z=11.85){
  const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy);
  const m=new THREE.Mesh(new THREE.BoxGeometry(L,w,.08),glow(col));
  m.position.set((x1+x2)/2,(y1+y2)/2,z);m.rotation.z=Math.atan2(dy,dx);scene.add(m)}
function polyNeon(pts,w,col,z){for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length];neonBar(a[0],a[1],b[0],b[1],w,col,z)}}
function ledPoly(pts,map,z=11.9){
  const g=new THREE.ShapeGeometry(new THREE.Shape(pts.map(p=>new THREE.Vector2(p[0],p[1]))));
  const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const uv=g.attributes.uv,ps=g.attributes.position;
  for(let i=0;i<uv.count;i++)uv.setXY(i,(ps.getX(i)-x0)/(x1-x0),(ps.getY(i)-y0)/(y1-y0));
  const m=new THREE.Mesh(g,new THREE.MeshBasicMaterial({map,side:THREE.DoubleSide}));m.position.z=z;scene.add(m)}

// man LED trung tam: texture dong (duong ham vu tru)
const stars=[...Array(140)].map(()=>[Math.random(),Math.random(),Math.random()]);
const mainTex=new THREE.CanvasTexture(Object.assign(document.createElement('canvas'),{width:512,height:256}));
const mctx=mainTex.image.getContext('2d');
function drawMain(t){const w=512,h=256,g=mctx;
  const bg=g.createRadialGradient(w/2,h/2,10,w/2,h/2,w*.6);bg.addColorStop(0,'#1d6bff');bg.addColorStop(.5,'#0a1a72');bg.addColorStop(1,'#04062a');
  g.fillStyle=bg;g.fillRect(0,0,w,h);
  stars.forEach(s=>{g.fillStyle='rgba(200,230,255,'+(.3+.7*Math.abs(Math.sin(t+s[2]*9)))+')';g.fillRect(s[0]*w,s[1]*h,2,2)});
  g.strokeStyle='rgba(120,220,255,.85)';
  for(let i=0;i<6;i++){const r=((t*30+i*28)%170)+6;g.lineWidth=2+r/60;g.globalAlpha=1-r/180;g.beginPath();g.arc(w/2,h/2,r,0,7);g.stroke()}
  g.globalAlpha=.6;g.lineWidth=1.5;
  for(let i=0;i<24;i++){const a=i/24*6.283+t*.3;g.beginPath();g.moveTo(w/2+Math.cos(a)*30,h/2+Math.sin(a)*30);g.lineTo(w/2+Math.cos(a)*260,h/2+Math.sin(a)*260);g.stroke()}
  g.globalAlpha=1;g.fillStyle='#fff';g.beginPath();g.arc(w/2,h/2,14,0,7);g.fill();
  mainTex.needsUpdate=true}
drawMain(0);
const sideTex=tex(256,64,(g,w,h)=>{const gr=g.createLinearGradient(0,0,w,h);gr.addColorStop(0,'#06124a');gr.addColorStop(.5,'#2a1a9a');gr.addColorStop(1,'#0a2a8a');
  g.fillStyle=gr;g.fillRect(0,0,w,h);for(let i=0;i<70;i++){g.fillStyle='rgba(190,220,255,'+Math.random()+')';g.fillRect(Math.random()*w,Math.random()*h,2,2)}});

ledPoly([[-5,7.4],[5,7.4],[3.7,3.2],[-3.7,3.2]],mainTex);
polyNeon([[-5,7.4],[5,7.4],[3.7,3.2],[-3.7,3.2]],.16,CY,11.85);
polyNeon([[-5.7,8],[5.7,8],[4.3,2.8],[-4.3,2.8]],.1,BL,11.85);
[-1,1].forEach(s=>{
  neonBar(s*5.7,8,s*9.8,2.2,.16,CY);neonBar(s*6.6,8,s*11.2,1.8,.1,BL);
  for(let i=0;i<4;i++){const cx=s*(9.2+.55*i),cy=6.9-1.35*i,w=3,h=.95;
    const p=[[cx-w/2,cy-h/2],[cx+w/2,cy-h/2],[cx+w/2,cy+h/2],[cx-w/2,cy+h/2]];
    ledPoly(p,sideTex);polyNeon(p,.08,i%2?BL:CY,11.85)}
  neonBar(s*13.6,1.2,s*13.6,6.5,.1,VI);neonBar(s*13.0,1.6,s*13.0,5.5,.06,VI)});

// san khau + khoi cube phat sang
const stage=rbox(13,.5,3.4,.06,std(0x0a0f2a,.2,.8),8);stage.position.set(-1,.25,10.3);scene.add(stage);
for(let i=0;i<10;i++){const geo=new THREE.BoxGeometry(1.2,.7,.5);
  const c=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:i%2?0x1b4dff:0x16a8ff}));c.position.set(-6.4+i*1.3,.85,8.95);scene.add(c);

function truss(x1,x2,y,z){

const sofas=[],tables=[],seats=[];
scene.traverse(o=>{
  if(o.userData.sofaLen){sofas.push(o);const L=o.userData.sofaLen,inner=L-.7,n=Math.max(1,Math.round(inner/1.2)),cw=inner/n;
    for(let i=0;i<n;i++){const cx=-inner/2+cw*(i+.5),p=o.localToWorld(new V3(cx,0,.15)),f=o.localToWorld(new V3(cx,0,1.15)).sub(p);seats.push({p,h:Math.atan2(f.x,f.z)})}}
  if(o.userData.tbl)tables.push(o)});
const tv=new V3(),boxes=[[-7.6,5.6,8.6,12.2],[8,14,7.3,8.7]];
function pushOBB(o,hl,hd,p,r){tv.copy(p);o.worldToLocal(tv);const cx=clamp(tv.x,-hl,hl),cz=clamp(tv.z,-hd,hd),dx=tv.x-cx,dz=tv.z-cz,d=Math.hypot(dx,dz);
  if(d>=r||d<1e-4)return;tv.x=cx+dx/d*r;tv.z=cz+dz/d*r;o.localToWorld(tv);p.x=tv.x;p.z=tv.z}
function collide(p,r){sofas.forEach(o=>pushOBB(o,o.userData.sofaLen/2+.05,.72,p,r));tables.forEach(o=>pushOBB(o,o.userData.tbl[0]/2,o.userData.tbl[1]/2,p,r));
  boxes.forEach(b=>{const cx=clamp(p.x,b[0],b[1]),cz=clamp(p.z,b[2],b[3]),dx=p.x-cx,dz=p.z-cz,d=Math.hypot(dx,dz);if(d<r&&d>1e-4){p.x=cx+dx/d*r;p.z=cz+dz/d*r}});
  p.x=clamp(p.x,-14.5,14.5);p.z=clamp(p.z,-11.5,11.5)}

  yf.src='https://www.youtube-nocookie.com/embed/'+id+'?autoplay=1&controls=0&playsinline=1&rel=0&modestbranding=1&enablejsapi=1&loop=1&playlist='+id+(start>0?'&start='+start:'')+(/^https?:$/.test(location.protocol)?'&origin='+encodeURIComponent(location.origin):'')+'&widget_referrer='+encodeURIComponent(location.href.slice(0,200));
  ytOn=true;if(!/^https?:$/.test(location.protocol))toast('Lỗi 153 nếu mở file trực tiếp (file://): hãy chạy qua server/https')}
function ytOff(){yf.src='about:blank';yf.style.display='none';ytOn=false;ytScr.visible=false;ytGlow.intensity=0}
function ytPlay(){const m=$('ytin').value.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/);
  if(!m){toast('Link YouTube không hợp lệ');return}
  if(!isHost){toast('Chỉ host mới được bật nhạc');return}
  sendMusic('yt',m[1]);toast('Đang tải video…')}
function ytStop(){if(isHost)sendMusic('beat')}
$('ytp').onclick=()=>{startAudio();ytPlay()};$('yts').onclick=ytStop;
$('ytin').addEventListener('keydown',e=>{e.stopPropagation();if(e.key=='Enter'){startAudio();ytPlay();$('ytin').blur()}});

// ---- multiplayer: server giu phong chung, 1 host duy nhat dieu khien nhac ----
let GLTF=null,ws=null,myId=null,hostId=null,isHost=false,online=false,offline=false,joined=false,myName='',muted=false,srvOff=0,sendT=0,lastS='';
let room={mode:'beat',vid:'',t0:Date.now()};
const peers=new Map(),srvNow=()=>Date.now()+srvOff;
$('yt').style.display='none';
function netSend(o){if(ws&&ws.readyState==1)ws.send(JSON.stringify(o))}
function isHostChar(c){return c===me?isHost:(online&&c.pid===hostId)}
function setTag(c){c.tag.textContent=(isHostChar(c)?'👑 ':'')+c.name+(c===me?' (bạn)':'')}
function refreshRoom(){const h=isHost?myName+' (bạn)':(peers.get(hostId)||{}).name;
  $('room').textContent='👥 '+(peers.size+1)+' người'+(h?' · 👑 '+h:'');$('room').style.display=joined||offline?'block':'none'}
function updBM(){const b=$('bM');
  b.textContent=isHost?(room.mode=='off'?'🎧 Bật nhạc (host)':'🎧 Tắt nhạc (host)'):room.mode=='off'?'🔇 Host đang tắt nhạc':muted?'🔇 Đã tắt tiếng (bấm để bật)':'🔊 Nhạc: bật (bấm để tắt tiếng)'}
function refreshAudio(){musicOn=room.mode=='beat'&&!muted;updBM()}
function applyMusic(m){room={mode:m.mode,vid:m.vid||'',t0:m.t0};
  if(m.mode=='yt')ytLoad(m.vid,Math.floor(Math.max(0,(srvNow()-m.t0)/1000)));else ytOff();
  refreshAudio()}
function sendMusic(mode,vid){if(online)netSend({t:'music',mode,vid});else if(offline)applyMusic({mode,vid,t0:Date.now()})}
function setHost(id){hostId=id;const was=isHost;isHost=online?id===myId:offline;
  $('yt').style.display=isHost?'flex':'none';chars.forEach(c=>{if(c===me||c.pid)setTag(c)});refreshRoom();updBM();
  if(isHost&&!was&&online)toast('Bạn là host: chỉ bạn bật được nhạc')}
function addPeer(p){if(peers.has(p.id))return;const c=mk(p.name,p.col,GLTF);c.pid=p.id;c.G.position.set(p.x,0,p.z);c.h=c.th=p.h;c.tx=p.x;c.tz=p.z;
  c.seat=p.seat>=0?seats[p.seat]||null:null;c.mv=p.mv;peers.set(p.id,c);setTag(c)}
function removePeer(id){const c=peers.get(id);if(!c)return;scene.remove(c.G);c.tag.remove();if(c.bub)c.bub.remove();const i=chars.indexOf(c);if(i>=0)chars.splice(i,1);peers.delete(id)}
function clearPeers(){[...peers.keys()].forEach(removePeer)}
function onNet(m,tSent){
  if(m.t=='welcome'){myId=m.id;myName=m.name;me.name=m.name;me.pid=m.id;srvOff=m.now+(Date.now()-tSent)/2-Date.now();
    online=true;joined=true;clearPeers();m.players.forEach(addPeer);applyMusic(m.music);setHost(m.host);setLights(m.lights!==false,null,true);
    $('join').style.display='none';toast('Chào '+m.name+'!')}
  else if(m.t=='join'){addPeer(m.p);refreshRoom();toast(m.p.name+' vừa vào quán')}
  else if(m.t=='leave'){const c=peers.get(m.id);if(c)toast(c.name+' đã rời quán');removePeer(m.id);refreshRoom()}
  else if(m.t=='host'){setHost(m.id)}
  else if(m.t=='music'){applyMusic(m)}
  else if(m.t=='lights'){setLights(!!m.on,m.by==myName?null:m.by)}
  else if(m.t=='err'){toast(m.msg)}
  else{const c=peers.get(m.id);if(!c)return;
    if(m.t=='s'){c.tx=m.x;c.tz=m.z;c.th=m.h;c.mv=m.mv;c.seat=m.seat>=0?seats[m.seat]||null:null}
    else if(m.t=='chat')say(c,m.txt,m.big);
    else if(m.t=='smk'&&c.smk<0)c.smk=0}}
function goOffline(msg){if(offline)return;offline=true;online=false;myName=myName||'Bạn';me.name=myName;
  $('join').style.display='none';room.t0=Date.now();srvOff=0;setHost(null);setTag(me);toast(msg)}
function connect(name){
  const q=new URLSearchParams(location.search).get('ws'),http=/^https?:$/.test(location.protocol);
  const url=q||(http?(location.protocol=='https:'?'wss://':'ws://')+location.host+'/ws':null);
  if(!url){goOffline('Đang chơi một mình (mở file trực tiếp, chưa có server)');return}
  let opened=false,tSent=0,sock;
  try{sock=ws=new WebSocket(url)}catch(e){goOffline('Không kết nối được server — chơi một mình');return}
  const to=setTimeout(()=>{if(!opened)sock.close()},6000);
  sock.onopen=()=>{opened=true;clearTimeout(to);tSent=Date.now();sock.send(JSON.stringify({t:'join',name}))};
  sock.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}onNet(m,tSent)};
  sock.onclose=()=>{clearTimeout(to);if(sock!==ws)return;
    if(joined){online=false;isHost=false;clearPeers();$('yt').style.display='none';refreshRoom();updBM();toast('Mất kết nối, đang nối lại…');setTimeout(()=>connect(myName),2000)}
    else goOffline('Không kết nối được server — chơi một mình')}}
function doJoin(){const n=$('jn').value.trim().replace(/\s+/g,' ').slice(0,16);if(!n){$('jn').focus();return}
  try{localStorage.setItem('nl_name',n)}catch(e){}
  startAudio();myName=n;$('jgo').disabled=true;$('jgo').textContent='Đang vào…';connect(n)}
$('jgo').onclick=doJoin;$('jn').addEventListener('keydown',e=>{if(e.key=='Enter')doJoin()});
try{$('jn').value=localStorage.getItem('nl_name')||''}catch(e){}
function netTick(dt,now){
  const k=1-Math.exp(-12*dt);
  peers.forEach(c=>{const p=c.G.position;if(Math.hypot(c.tx-p.x,c.tz-p.z)>6){p.x=c.tx;p.z=c.tz}else{p.x+=(c.tx-p.x)*k;p.z+=(c.tz-p.z)*k}c.h=lerpA(c.h,c.th,k)});
  chars.forEach(c=>{if(c===me||c.pid){const p=c.G.position;c.dance=room.mode!='off'&&!c.seat&&!(c.mv>.1)&&Math.hypot(p.x-dance.position.x,p.z-dance.position.z)<5.5}});
  if(!online)return;
  const st=[me.G.position.x.toFixed(2),me.G.position.z.toFixed(2),me.h.toFixed(2),me.seat?seats.indexOf(me.seat):-1,me.mv>.1?1:0].join();
  if((st!==lastS&&now-sendT>100)||now-sendT>1000){sendT=now;lastS=st;const a=st.split(',');netSend({t:'s',x:+a[0],z:+a[1],h:+a[2],seat:+a[3],mv:+a[4]})}}
updBM();

let last=performance.now();
window.gameUpdate=function(){
  const now=performance.now(),dt=Math.min(.05,(now-last)/1000);last=now;if(!ready)return;
  moveMe(dt);netTick(dt,now);audioTick();npcs.forEach(n=>updNpc(n,dt));
  chars.forEach(c=>{animate(c,now/1000,dt);ui(c,dt)});updPuffs(dt);
  const tgt=new V3(me.G.position.x,me.G.position.y+1.2,me.G.position.z),
    des=tgt.clone().add(new V3(Math.sin(cy)*Math.cos(cp),Math.sin(cp),Math.cos(cy)*Math.cos(cp)).multiplyScalar(dist));
  des.x=clamp(des.x,-14.7,14.7);des.z=clamp(des.z,-11.7,11.7);des.y=clamp(des.y,.5,8.4);
  cam.position.lerp(des,1-Math.exp(-10*dt));cam.lookAt(tgt);ytTick()};

function init(gltf){
  GLTF=gltf;me=mk('Bạn',0xffa63d,gltf);me.G.position.set(-1+rnd(-2,2),0,-1+rnd(-2,2));me.h=0;
  [[-1.9,'DJ Kenzo',0x3df0ff],[-.1,'DJ Mai',0xff4fd8]].forEach(([x,nm,c])=>{const n=mk(nm,c,gltf);n.G.position.set(x,.5,11);n.h=Math.PI;n.dj=1;n.chat=rnd(10,25);npcs.push(n)});
  ['Minh','Lan','Tuấn','Hà'].forEach((nm,i)=>{const n=mk(nm,[0xff6b9a,0x7cff6b,0xb58cff,0xffe14d][i],gltf);n.G.position.set(rnd(-5,3),0,rnd(0,6));n.wait=rnd(0,3);npcs.push(n)});
  ready=true;$('jgo').disabled=false;$('jgo').textContent='Vào quán';$('jn').focus()}
const buf=Uint8Array.from(atob(GLB_B64),c=>c.charCodeAt(0)).buffer;
new THREE.GLTFLoader().parse(buf,'',init,()=>toast('Không tải được model nhân vật'));
})();
</script>
